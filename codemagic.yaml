workflows:
  salansa_android:
    name: Salansa Data Android APK
    max_build_duration: 30
    scripts:
      - name: Extract Salansa Data Android project
        script: |
          rm -rf SalansaDataApp
          unzip -q SalansaDataApp.zip
      - name: Build Android APK
        script: |
          cd SalansaDataApp
          gradle --no-daemon assembleDebug
    artifacts:
      - SalansaDataApp/app/build/outputs/apk/debug/*.apk
